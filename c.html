<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificado de pieza · Demo de Vonoa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
  body{padding-bottom:40px}
  .hoja{max-width:460px;margin:24px auto;background:#fff;border:1px solid var(--linea);border-radius:20px;padding:24px;position:relative;overflow:hidden}
  .hoja::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--oro),#E2C78C,var(--oro))}
  .sello{display:inline-flex;align-items:center;gap:8px;background:#E6F2EB;color:var(--verde);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.86rem;margin:6px 0 14px}
  .sello svg{width:16px;height:16px;fill:var(--verde)}
  .hoja h1{font-size:2.3rem;margin:.1em 0 .4em}
  .hoja dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
  .hoja dt{color:var(--gris)}
  .hoja dd{margin:0;font-family:var(--mono);font-size:.9rem}
  .que{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--linea);color:var(--gris);font-size:.9rem}
</style>
</head>
<body>
<div class="aviso">Demo de <b>Vonoa</b> · pieza de ejemplo</div>
<div class="wrap">
  <article class="hoja" id="hoja">
    <p class="spec">Certificado de pieza</p>
  </article>
  <p style="text-align:center"><a class="btn-sec" href="./">Ver el catálogo de la demo</a></p>
</div>
<script src="piezas.js"></script>
<script>
  (function () {
    const D = window.DEMO;
    const id = new URLSearchParams(location.search).get("p");
    const p = D.piezas.find((x) => x.id === id);
    const h = document.getElementById("hoja");
    if (!p) { h.insertAdjacentHTML("beforeend", "<h1>Folio no encontrado</h1><p>Revise el código que escaneó.</p>"); return; }
    const m = D.metales[p.metal];
    h.insertAdjacentHTML("beforeend", `
      <div class="sello"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>Pieza registrada por el taller</div>
      <h1>${p.nombre}</h1>
      <dl>
        <dt>Folio</dt><dd>VN-${p.id}</dd>
        <dt>Metal</dt><dd>${m.nombre}</dd>
        <dt>Ley</dt><dd>${m.ley}</dd>
        <dt>Peso</dt><dd>${p.peso.toFixed(2)} g</dd>
        <dt>Taller</dt><dd>${D.negocio}, ${D.ciudad}</dd>
        <dt>Registro</dt><dd>Aquí va el registro de contraste o la verificación del Grupo de Calidad</dd>
      </dl>
      <p class="que">Esto es lo que ve su cliente al escanear el código QR de la etiqueta o del empaque: la prueba de que la pieza es lo que dice ser, aunque en una foto no se note.</p>`);
  })();
</script>
</body>
</html>
